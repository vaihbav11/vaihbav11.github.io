<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaibhav Chaturvedi — AI/ML Engineer</title>
<meta name="description" content="AI/ML Engineer specialising in NLP, deep learning, and deployed ML systems.">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<!-- ================= NAV ================= -->
<header class="nav" id="nav">
  <a href="#hero" class="logo"><span id="logoInitials"></span></a>
  <nav class="nav-links">
    <a href="#work">Work</a>
    <a href="#experience">Experience</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#contact">Contact</a>
  </nav>
  <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span>
  </button>
</header>

<main>

  <!-- ============ 1. HERO — tone: deepest slate ============ -->
  <section class="hero tone-dark" id="hero">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="inner">
      <p class="hero-eyebrow"><span class="dot"></span><span id="heroLocation"></span></p>
      <h1 class="hero-name" id="heroName"></h1>
      <p class="hero-role">
        <span class="typed" id="typed"></span><span class="caret"></span>
      </p>
      <p class="hero-tagline" id="heroTagline"></p>
      <div class="hero-cta">
        <a href="#work" class="btn btn-primary">View work</a>
        <a href="#contact" class="btn btn-ghost">Contact me</a>
      </div>
      <div class="hero-stats" id="heroStats"></div>
    </div>
    <a href="#work" class="scroll-hint" aria-label="Scroll down"><span></span></a>
  </section>

  <!-- ============ 2. MARQUEE ============ -->
  <section class="marquee-wrap tone-dark" aria-label="Technical skills">
    <div class="marquee" id="marquee"></div>
  </section>

  <!-- ============ 3. WORK — tone: slate lifting ============ -->
  <section class="section tone-dark" id="work">
    <div class="inner">
      <div class="section-head">
        <h2>Selected work</h2>
        <p>Things I've built, shipped, and measured.</p>
      </div>
      <div class="bento" id="bento"></div>
    </div>
  </section>

  <!-- ============ 4. EXPERIENCE — tone: dusk blue ============ -->
  <section class="section tone-dark" id="experience">
    <div class="inner">
      <div class="section-head">
        <h2>Experience</h2>
        <p>Where I've worked and what I shipped there.</p>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- ============ 5. SKY BAND — the dusk-to-daylight handoff ============ -->
  <div class="sky-band" aria-hidden="true"></div>

  <!-- ============ 6. ABOUT — tone: exact sky of the photo ============ -->
  <section class="section tone-light" id="about">
    <div class="inner">
      <div class="about-grid">
        <div class="about-text">
          <div class="section-head"><h2>About</h2></div>
          <div id="aboutText"></div>
          <div class="photo-meta" id="photoMeta"></div>
        </div>
        <div class="about-media">
          <div class="photo-frame" id="photoFrame"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 7. SKILLS — tone: haze toward white ============ -->
  <section class="section tone-light" id="skills">
    <div class="inner">
      <div class="section-head">
        <h2>Toolkit</h2>
        <p>What I reach for day to day.</p>
      </div>
      <div class="skill-grid" id="skillGrid"></div>

      <div class="edu-grid">
        <div class="edu-col">
          <h3>Education</h3>
          <div id="education"></div>
        </div>
        <div class="edu-col">
          <h3>Certifications</h3>
          <div id="certs"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- ============ 8. CONTACT — tone: resolves to white ============ -->
<footer class="contact tone-light" id="contact">
  <div class="inner">
    <h2 id="contactHeading"></h2>
    <p class="contact-blurb" id="contactBlurb"></p>
    <div class="contact-links" id="contactLinks"></div>
    <div class="footer-bar">
      <span id="footerName"></span>
      <span>Built by hand · hosted on GitHub Pages</span>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
